name: Differential

# Compares our Q8_0 / Q4_0 against ggml's own reference code, compiled from the pinned llama.cpp
# commit on this runner. Hosted runners only: this is a public repository.

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  LLAMA_CPP_SHA: 9d57ce456c94d241dde672b2db9cf18879766568

jobs:
  llama-cpp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ggml-org/llama.cpp
          ref: 9d57ce456c94d241dde672b2db9cf18879766568
          path: llama.cpp
          sparse-checkout: |
            ggml
            LICENSE
      - uses: dtolnay/rust-toolchain@5059963b1731bf1580991b5f3b1eecfb5da406c0 # 1.98.0 (branch)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Pinned commit is the one we think it is
        run: |
          cd llama.cpp
          test "$(git rev-parse HEAD)" = "$LLAMA_CPP_SHA"
      - name: Build ggml reference harnesses
        run: |
          mkdir -p out
          for f in q8_0 q4_0 iq4_nl iq4_xs iq3_s q2_k q3_k q4_k q5_k q6_k; do
            # -DNDEBUG as llama.cpp builds (the K-quant reference asserts on out-of-range intermediates).
            gcc -O2 -DNDEBUG -ffp-contract=off -w \
              -Illama.cpp/ggml/src -Illama.cpp/ggml/include \
              tools/golden/${f}_reference.c llama.cpp/ggml/src/ggml-quants.c -lm -o out/ref_$f
          done
      - name: Build the decode-only reference
        run: |
          gcc -O2 -DNDEBUG -ffp-contract=off -w \
            -Illama.cpp/ggml/src -Illama.cpp/ggml/include \
            tools/golden/iq_dequant_reference.c llama.cpp/ggml/src/ggml-quants.c -lm -o out/ref_iq_dequant
      - name: Build our converters
        run: |
          cargo build --release --locked -p ml-convertant-ggml --example convert_file
          cargo build --release --locked -p ml-convertant-kquants --example convert_kquants_file
      - name: Committed vectors reproduce from the pinned reference
        run: |
          for f in q8_0 q4_0 iq4_nl iq4_xs iq3_s q2_k q3_k q4_k q5_k q6_k; do
            case $f in *_k) g=crates/ml-convertant-kquants/tests/golden;; *) g=crates/ml-convertant-ggml/tests/golden;; esac
            out/ref_$f $g/$f.in.f32 out/$f.gold.bin out/$f.gold.deq
            cmp out/$f.gold.bin $g/$f.out.bin
            cmp out/$f.gold.deq $g/$f.deq.f32
          done
          # IQ4_NL with an importance vector (one 64-element row repeated over the input's rows)
          g=crates/ml-convertant-ggml/tests/golden
          out/ref_iq4_nl $g/iq4_nl.in.f32 out/iq4_nl_w.gold.bin out/iq4_nl_w.gold.deq $g/iq4_nl.imp.f32
          cmp out/iq4_nl_w.gold.bin $g/iq4_nl_w.out.bin
          cmp out/iq4_nl_w.gold.deq $g/iq4_nl_w.deq.f32
          # IQ4_XS with an importance vector (one 512-element row repeated over the input's rows)
          out/ref_iq4_xs $g/iq4_xs.in.f32 out/iq4_xs_w.gold.bin out/iq4_xs_w.gold.deq $g/iq4_xs.imp.f32
          cmp out/iq4_xs_w.gold.bin $g/iq4_xs_w.out.bin
          cmp out/iq4_xs_w.gold.deq $g/iq4_xs_w.deq.f32
          # IQ3_S with an importance vector (one 512-element row repeated over the input's rows)
          out/ref_iq3_s $g/iq3_s.in.f32 out/iq3_s_w.gold.bin out/iq3_s_w.gold.deq $g/iq3_s.imp.f32
          cmp out/iq3_s_w.gold.bin $g/iq3_s_w.out.bin
          cmp out/iq3_s_w.gold.deq $g/iq3_s_w.deq.f32
          # IQ3_S's grid table is regenerated from the pinned checkout and must equal the committed copy
          python tools/golden/gen_iq3s_grid.py llama.cpp out/iq3s_grid.rs
          # (the Windows checkout may have CRLF line endings; the blob is LF)
          tr -d '\r' < crates/ml-convertant-ggml/src/iq3s_grid.rs > out/iq3s_grid.committed.rs
          cmp out/iq3s_grid.rs out/iq3s_grid.committed.rs
          # ggml's IQ3_S output on a block with an exactly-zero sub-block (which we deliberately do not reproduce)
          out/ref_iq3_s $g/iq3_s_zero_sub_block.in.f32 out/iq3_s_zs.bin out/iq3_s_zs.deq
          cmp out/iq3_s_zs.bin $g/iq3_s_zero_sub_block.ggml.out.bin
          cmp out/iq3_s_zs.deq $g/iq3_s_zero_sub_block.ggml.deq.f32
      - name: Decode-only vectors and tables reproduce from the pinned reference
        run: |
          g=crates/ml-convertant-ggml/tests/golden
          out/ref_iq_dequant iq3_xxs $g/iq3_xxs.blocks.bin out/iq3_xxs.gold.deq
          cmp out/iq3_xxs.gold.deq $g/iq3_xxs.deq.f32
          # the lookup tables are regenerated from the pinned checkout and must equal the committed copy
          python tools/golden/gen_iq_tables.py llama.cpp out/iq_tables.rs
          tr -d '' < crates/ml-convertant-ggml/src/iq_tables.rs > out/iq_tables.committed.rs
          cmp out/iq_tables.rs out/iq_tables.committed.rs
      - name: Our output equals the reference on random data
        run: |
          for seed in 1 2 3; do
            python tools/golden/gen_random_f32.py out/rand.f32 20000 $seed
            for f in q8_0 q4_0 iq4_nl iq4_xs iq3_s q2_k q3_k q4_k q5_k q6_k; do
              case $f in *_k) bin=convert_kquants_file;; *) bin=convert_file;; esac
              out/ref_$f out/rand.f32 out/ref.bin out/ref.deq
              target/release/examples/$bin $f out/rand.f32 out/our.bin out/our.deq
              cmp out/ref.bin out/our.bin
              cmp out/ref.deq out/our.deq
              echo "$f seed $seed: $(wc -c < out/ref.bin) bytes identical"
            done
            # IQ4_NL with a random non-negative importance vector (one 32-element row, so any input length works)
            python -c "import random,struct,sys; random.seed($seed); sys.stdout.buffer.write(struct.pack('<32f',*[random.uniform(0,4) for _ in range(32)]))" > out/imp.f32
            out/ref_iq4_nl out/rand.f32 out/ref.bin out/ref.deq out/imp.f32
            target/release/examples/convert_file iq4_nl out/rand.f32 out/our.bin out/our.deq out/imp.f32
            cmp out/ref.bin out/our.bin
            cmp out/ref.deq out/our.deq
            echo "iq4_nl (importance) seed $seed: $(wc -c < out/ref.bin) bytes identical"
            # IQ4_XS with a random non-negative importance vector (one 256-element row)
            python -c "import random,struct,sys; random.seed($seed); sys.stdout.buffer.write(struct.pack('<256f',*[random.uniform(0,4) for _ in range(256)]))" > out/imp256.f32
            out/ref_iq4_xs out/rand.f32 out/ref.bin out/ref.deq out/imp256.f32
            target/release/examples/convert_file iq4_xs out/rand.f32 out/our.bin out/our.deq out/imp256.f32
            cmp out/ref.bin out/our.bin
            cmp out/ref.deq out/our.deq
            echo "iq4_xs (importance) seed $seed: $(wc -c < out/ref.bin) bytes identical"
            out/ref_iq3_s out/rand.f32 out/ref.bin out/ref.deq out/imp256.f32
            target/release/examples/convert_file iq3_s out/rand.f32 out/our.bin out/our.deq out/imp256.f32
            cmp out/ref.bin out/our.bin
            cmp out/ref.deq out/our.deq
            echo "iq3_s (importance) seed $seed: $(wc -c < out/ref.bin) bytes identical"
          done
