[package]
name = "ml-convertant-mlmf"
description = "Read a GGUF with MLMF, convert its dense tensors to a ggml quantized type with measured error, write a new GGUF."
readme = "README.md"
keywords = ["machine-learning", "gguf", "quantization", "mlmf", "conversion"]
categories = ["science"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ml-convertant-core = { path = "../ml-convertant-core", version = "0.1.17" }
ml-convertant-ggml = { path = "../ml-convertant-ggml", version = "0.1.17" }
ml-convertant-kquants = { path = "../ml-convertant-kquants", version = "0.1.17" }
half = "2"
mlmf-core = "~0.7.26"
mlmf-ggml = "~0.7.26"
mlmf-gguf = "~0.7.26"
